<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>姿勢・重心ビューワー</title>
</head>

<body>

  <h1>姿勢・重心ビューワー</h1>


<video id="video" autoplay playsinline></video>

<br>

<button id="startButton">カメラを起動</button>

<p id="status">カメラを起動してください</p>

<canvas id="canvas"></canvas>

<style>
  body {
    margin: 0;
    padding: 20px;
    text-align: center;
    font-family: sans-serif;
    background: #f5f5f5;
  }

  video {
    width: 100%;
    max-width: 600px;
    border-radius: 12px;
  }

  button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 18px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const startButton = document.getElementById("startButton");
  const status = document.getElementById("status");

  const pose = new Pose({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  
    pose.onResults((results) => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.poseLandmarks) {
      drawConnectors(
        ctx,
        results.poseLandmarks,
        POSE_CONNECTIONS,
        { color: "#00FF00", lineWidth: 4 }
      );

      drawLandmarks(
        ctx,
        results.poseLandmarks,
        { color: "#FF0000", lineWidth: 2, radius: 5 }
      );
    }
  });
  
    startButton.addEventListener("click", async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      status.textContent = "カメラ起動中";
    } catch (error) {
      status.textContent = "カメラを起動できませんでした";
      console.error(error);
    }
  });

  async function processVideo() {
    if (video.readyState >= 2) {
      await pose.send({ image: video });
    }
    requestAnimationFrame(processVideo);
  }

  video.addEventListener("playing", processVideo);
  console.log("JavaScript OK");
</script>

</body>
</html>
