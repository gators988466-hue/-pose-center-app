<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>姿勢・重心ビューワー</title>
</head>
<style>
  body {
    margin: 0;
    padding: 20px;
    text-align: center;
    font-family: sans-serif;
    background: #f5f5f5;
  }

  h1 {
    font-size: 24px;
  }

  .camera-container {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 20px auto;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }

  video {
    display: block;
    width: 100%;
    transform: scaleX(-1);
  }

  canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
  }

  button {
    margin-top: 20px;
    padding: 14px 28px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
  }

  #status {
    margin-top: 15px;
  }
</style>
<script type="module">
  import {
    PoseLandmarker,
    FilesetResolver,
    DrawingUtils
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const startButton = document.getElementById("startButton");
  const status = document.getElementById("status");

  let poseLandmarker = null;
  let running = false;

  async function createPoseLandmarker() {
    status.textContent = "人体認識を準備しています...";

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );

    poseLandmarker = await PoseLandmarker.createFromOptions(
      vision,
      {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
        },
        runningMode: "VIDEO",
        numPoses: 1
      }
    );
  }
  async function startCamera() {
    try {
      status.textContent = "カメラを起動しています...";

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      await createPoseLandmarker();

      running = true;

      status.textContent =
        "カメラ起動中・人体を探しています...";

      detectPose();

    } catch (error) {
      console.error(error);

      status.textContent =
        "起動できませんでした: " + error.message;
    }
  }

  startButton.addEventListener("click", startCamera);
  let lastVideoTime = -1;

  function detectPose() {
    if (!running || !poseLandmarker) return;

    if (
      video.readyState >= 2 &&
      video.currentTime !== lastVideoTime
    ) {
      lastVideoTime = video.currentTime;

      const results = poseLandmarker.detectForVideo(
        video,
        performance.now()
      );

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      if (
        results.landmarks &&
        results.landmarks.length > 0
      ) {
        const drawingUtils = new DrawingUtils(ctx);

        drawingUtils.drawConnectors(
          results.landmarks[0],
          PoseLandmarker.POSE_CONNECTIONS,
          {
            color: "#00ff00",
            lineWidth: 4
          }
        );

        drawingUtils.drawLandmarks(
          results.landmarks[0],
          {
            color: "#ff0000",
            radius: 5
          }
        );

        status.textContent =
          "人体を認識しています";
      }
    }

    requestAnimationFrame(detectPose);
  }
</script>

</body>
</html>
